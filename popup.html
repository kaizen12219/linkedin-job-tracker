<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn Job Scraper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="header">
        <div>
          <h1>Save to Kai Flow</h1>
          <p id="status" role="status">Ready to read the LinkedIn job.</p>
        </div>
        <button id="scrape" type="button">Scrape</button>
      </header>

      <div class="scroll-content">
        <section class="connection">
          <p id="connectionStatus" role="status">Checking Kai Flow…</p>
          <button id="refreshConnection" class="secondary" type="button">Refresh</button>
        </section>
        <p>Jobs are saved in Kai Flow. Use its publish button to copy them to Google Sheets.</p>
        <details id="bannedSettings">
          <summary>Banned companies</summary>
          <div class="settings-fields">
            <label>
              <span>One company per line</span>
              <textarea id="bannedCompanies" class="company-list" placeholder="Company A&#10;Company B"></textarea>
            </label>
            <p id="bannedStatus" role="status">This separate list syncs with Chrome and can also be exported for another PC.</p>
            <div class="settings-actions">
              <button id="saveBanned" type="button">Save list</button>
              <button id="exportBanned" class="secondary" type="button">Export</button>
              <label class="button-link secondary import-button" for="importBanned">Import</label>
              <input id="importBanned" class="visually-hidden" type="file" accept=".txt,.json,text/plain,application/json">
            </div>
          </div>
        </details>
      <section class="fields">
        <label>
          <span>Company</span>
          <input id="company" maxlength="1000" placeholder="Company" required>
        </label>
        <aside id="duplicate" class="duplicate" hidden></aside>
        <label>
          <span>Job title</span>
          <input id="title" maxlength="1000" placeholder="Job title" required>
        </label>
        <label>
          <span>Apply URL</span>
          <input id="applyUrl" maxlength="4096" placeholder="https://…">
        </label>
        <label>
          <span>Profile (optional)</span>
          <select id="profile" disabled><option value="">No profile</option></select>
        </label>
        <label>
          <span>Job description</span>
          <textarea id="description" maxlength="49000" placeholder="Job description" required></textarea>
        </label>
      </section>

      <details>
        <summary>Raw JSON</summary>
        <pre id="json">{}</pre>
      </details>
      </div>
      <section class="actions">
        <button id="saveSheet" type="button" disabled>Save</button>
        <button id="copyJson" class="secondary" type="button" disabled>Copy JSON</button>
        <a id="openApplyUrl" class="button-link secondary disabled" href="#" target="_blank" rel="noreferrer">Apply URL</a>
      </section>
    </main>

    <script src="src/popup-kai-flow.js"></script>
  </body>
</html>
